      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EVIDENCE_PLATFORM: ipad
    defaults:
      run:
        working-directory: Packages/PlannerCore
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the selected toolchain and record runner identity
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee xcode-version.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') xcode-version.txt
          swift --version
          sw_vers
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Select rendering-qualifier Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Inventory the exact iPad renderer destination
        run: |
          set -euo pipefail
          xcrun simctl list --json > simulator-inventory.json
          xcodebuild -scheme PlannerCore -showdestinations > simulator-destinations.log 2>&1
          python3 - <<'PYTHON'
          import json
