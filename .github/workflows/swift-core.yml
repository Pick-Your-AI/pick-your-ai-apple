            python3 tools/conformance/qualify_evidence_rendering.py "$RUNNER_TEMP/evidence-rendering/evidence-$label-test.log"
          done < Packages/PlannerCore/simulator-selection.tsv
      - name: Retain the iPad rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-core-evidence-ipad
          path: |
            Packages/PlannerCore/*-version.txt
            Packages/PlannerCore/simulator-inventory.json
            Packages/PlannerCore/simulator-destinations.log
            Packages/PlannerCore/simulator-selection.tsv
            ${{ runner.temp }}/evidence-rendering/
          if-no-files-found: warn
          retention-days: 14

  macos-core:
    needs: [scope, core_validation, render_iphone, render_ipad]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Core validation and both selected renderer platforms
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native_required }}
          CORE_RESULT: ${{ needs.core_validation.result }}
          IPHONE_RESULT: ${{ needs.render_iphone.result }}
          IPAD_RESULT: ${{ needs.render_ipad.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$NATIVE_REQUIRED" in
            true)
              test "$CORE_RESULT" = success
              test "$IPHONE_RESULT" = success
              test "$IPAD_RESULT" = success
              ;;
            false)
              test "$CORE_RESULT" = skipped
              test "$IPHONE_RESULT" = skipped
              test "$IPAD_RESULT" = skipped
              ;;
            *)
              echo "Missing or invalid native scope result" >&2
              exit 1
              ;;
          esac
