name: Swift client core

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: macos-core documentation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative scope selection
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_native_scope.py' -v
      - name: Inspect complete exact Git comparison
        id: scope
        env:
          APPLE_CI_JOB: macos-core
          APPLE_CI_EVENT: ${{ github.event_name }}
          APPLE_CI_HEAD: ${{ github.sha }}
          APPLE_CI_BASE: ${{ github.event.pull_request.base.sha }}
          APPLE_CI_BEFORE: ${{ github.event.before }}
        run: python3 tools/ci/native_scope.py
  core_validation:
    name: macos-core-validation
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native_required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: Packages/PlannerCore
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the selected toolchain and record runner identity
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee xcode-version.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') xcode-version.txt
          swift --version
          sw_vers
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Select mutation-runner Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Test mutation output paths on the macOS filesystem
        working-directory: .
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tools/conformance/tests -p test_swift_mutations.py -v 2>&1 | tee Packages/PlannerCore/swift-mutation-runner-tests.log
          python -B -O -m unittest discover -s tools/conformance/tests -p test_swift_mutations.py -v 2>&1 | tee Packages/PlannerCore/swift-mutation-runner-optimized-tests.log
      - name: Build and test Swift 6 core on macOS
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Test optimized Swift core
        run: |
          set -euo pipefail
          swift test -c release 2>&1 | tee swift-release-test.log
      - name: Compile the core for the iOS Simulator SDK without signing
        run: |
          set -euo pipefail
          xcodebuild -scheme PlannerCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/planner-core-derived CODE_SIGNING_ALLOWED=NO build 2>&1 | tee simulator-build.log
      - name: Inventory exact iPhone and iPad simulator destinations
        run: |
          set -euo pipefail
          xcrun simctl list --json > simulator-inventory.json
          xcodebuild -scheme PlannerCore -showdestinations > simulator-destinations.log 2>&1
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          inventory = json.loads(Path("simulator-inventory.json").read_text())
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          if not any(r["identifier"] == runtime and r.get("isAvailable") for r in inventory["runtimes"]):
              raise SystemExit("Required installed iOS 18.5 runtime unavailable; do not substitute or download")
          targets = [("iphone", "iPhone SE (3rd generation)"), ("ipad", "iPad (10th generation)")]
          destinations = []
          for label, name in targets:
              matches = [d for d in inventory["devices"].get(runtime, []) if d["name"] == name and d.get("isAvailable")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one available {name} on iOS 18.5; found {len(matches)}")
              destinations.append(f"{label}\t{matches[0]['udid']}")
              print(f"{label}: {name}, iOS 18.5, {matches[0]['udid']}")
          Path("simulator-selection.tsv").write_text("\n".join(destinations) + "\n")
          PYTHON
      - name: Execute package XCTest on compact iPhone and iPad simulators
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r label udid; do
            xcodebuild test -scheme PlannerCore \
              -destination "platform=iOS Simulator,id=$udid" \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              -derivedDataPath /tmp/planner-core-simulator-tests \
              -resultBundlePath "$PWD/simulator-$label.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "simulator-$label-test.log"
            # A successful compilation or empty test action cannot pass this gate.
            grep -E 'Test Case .*ContractDecimalTests.*testExactAdditionCarriesAcrossIntegerAndFraction.* passed' "simulator-$label-test.log"
            grep -E 'Executed [1-9][0-9]* tests?, with 0 failures' "simulator-$label-test.log"
          done < simulator-selection.tsv
      - name: Prove a failing Swift test returns failure
        run: |
          set -euo pipefail
          cp -R . /tmp/planner-core-negative
          cd /tmp/planner-core-negative
          rm -rf .build
          cat > Tests/PlannerCoreTests/IntentionalFailureTests.swift <<'SWIFT'
          import XCTest
          final class IntentionalFailureTests: XCTestCase {
              func testIntentionalGateFailure() { XCTFail("intentional negative gate probe") }
          }
          SWIFT
          if swift test --filter IntentionalFailureTests > negative-gate.log 2>&1; then
            cat negative-gate.log
            echo 'The intentional failure unexpectedly passed.' >&2
            exit 1
          fi
          grep -F 'intentional negative gate probe' negative-gate.log
          grep -E 'Test Case .*testIntentionalGateFailure.* failed' negative-gate.log
          cp negative-gate.log "$GITHUB_WORKSPACE/Packages/PlannerCore/negative-gate.log"
      - name: Detect required-field, decimal and stale-generation mutations
        working-directory: .
        run: >-
          python tools/conformance/swift_mutations.py
          --package Packages/PlannerCore
          --output-dir swift-mutation-evidence
      - name: Retain compile and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-core-validation
          path: |
            Packages/PlannerCore/*-version.txt
            Packages/PlannerCore/*.log
            Packages/PlannerCore/simulator-inventory.json
            Packages/PlannerCore/simulator-selection.tsv
            Packages/PlannerCore/simulator-*.xcresult
            swift-mutation-evidence/
          if-no-files-found: warn
          retention-days: 14

  render_iphone:
    name: macos-core-evidence-iphone
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native_required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EVIDENCE_PLATFORM: iphone
    defaults:
      run:
        working-directory: Packages/PlannerCore
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the selected toolchain and record runner identity
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee xcode-version.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') xcode-version.txt
          swift --version
          sw_vers
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Select rendering-qualifier Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Inventory the exact iPhone renderer destination
        run: |
          set -euo pipefail
          xcrun simctl list --json > simulator-inventory.json
          xcodebuild -scheme PlannerCore -showdestinations > simulator-destinations.log 2>&1
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          inventory = json.loads(Path("simulator-inventory.json").read_text())
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          if not any(r["identifier"] == runtime and r.get("isAvailable") for r in inventory["runtimes"]):
              raise SystemExit("Required installed iOS 18.5 runtime unavailable; do not substitute or download")
          platform = os.environ.get("EVIDENCE_PLATFORM")
          names = {"iphone": "iPhone SE (3rd generation)", "ipad": "iPad (10th generation)"}
          if platform not in names:
              raise SystemExit("Missing or unsupported evidence platform; no target may be omitted")
          targets = [(platform, names[platform])]
          destinations = []
          for label, name in targets:
              matches = [d for d in inventory["devices"].get(runtime, []) if d["name"] == name and d.get("isAvailable")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one available {name} on iOS 18.5; found {len(matches)}")
              destinations.append(f"{label}\t{matches[0]['udid']}")
              print(f"{label}: {name}, iOS 18.5, {matches[0]['udid']}")
          Path("simulator-selection.tsv").write_text("\n".join(destinations) + "\n")
          PYTHON
      - name: Render all evidence scenarios on the selected iPhone simulator
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-rendering"
          while IFS=$'\t' read -r label udid; do
            xcodebuild test -project tools/evidence-rendering/EvidenceHarness.xcodeproj -scheme EvidenceHarness \
              -only-testing:PlannerEvidenceUITests/EvidenceRenderingTests \
              -destination "platform=iOS Simulator,id=$udid" \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              -derivedDataPath /tmp/planner-evidence-rendering-tests \
              -resultBundlePath "$RUNNER_TEMP/evidence-rendering/evidence-$label.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "$RUNNER_TEMP/evidence-rendering/evidence-$label-test.log"
            # The strict existing parser requires actual unique XCTest starts,
            # passes and summaries; compile-only, empty and skipped runs fail.
            python3 tools/conformance/qualify_evidence_rendering.py "$RUNNER_TEMP/evidence-rendering/evidence-$label-test.log"
          done < Packages/PlannerCore/simulator-selection.tsv
      - name: Retain the iPhone rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-core-evidence-iphone
          path: |
            Packages/PlannerCore/*-version.txt
            Packages/PlannerCore/simulator-inventory.json
            Packages/PlannerCore/simulator-destinations.log
            Packages/PlannerCore/simulator-selection.tsv
            ${{ runner.temp }}/evidence-rendering/
          if-no-files-found: warn
          retention-days: 14

