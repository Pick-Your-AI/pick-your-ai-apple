name: Dependency review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALLOWED_DEPENDENCY_LICENSES: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0, Zlib, CC0-1.0, Unlicense
    steps:
      - name: Check out dependency policy and its regression tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise rejected dependency and recovery cases
        run: python3 -m unittest discover -s tools/security/tests -v
      - name: Review dependency changes with GitHub
        id: review
        uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: ${{ env.ALLOWED_DEPENDENCY_LICENSES }}
          vulnerability-check: true
          license-check: true
          warn-only: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Require complete dependency snapshots for the exact PR commits
        if: ${{ always() && steps.review.outcome != 'skipped' }}
        timeout-minutes: 2
        env:
          DEPENDENCY_REVIEW_TOKEN: ${{ github.token }}
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
        run: python3 tools/security/check_dependency_snapshots.py
      - name: Reject incomplete license or review evidence
        if: ${{ always() && steps.review.outcome != 'skipped' }}
        timeout-minutes: 2
        env:
          DEPENDENCY_REVIEW_TOKEN: ${{ github.token }}
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
        run: python3 tools/security/check_dependency_review.py
