name: Native local drafts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  scope:
    name: native-ui documentation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative scope selection
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_native_scope.py' -v
      - name: Test Swift execution evidence guards
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_swift_test_results.py' -v
      - name: Inspect complete exact Git comparison
        id: scope
        env:
          APPLE_CI_EVENT: ${{ github.event_name }}
          APPLE_CI_HEAD: ${{ github.sha }}
          APPLE_CI_BASE: ${{ github.event.pull_request.base.sha }}
          APPLE_CI_BEFORE: ${{ github.event.before }}
        run: python3 tools/ci/native_scope.py
  native-ui:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native_required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify unavailable and exact Xcode pins
        run: |
          set -o pipefail
          mkdir -p .build/native-evidence
          python3 -m unittest discover -s App/scripts/tests -p 'test_toolchain.py' -v 2>&1 | tee .build/native-evidence/pin-tests.txt
          python3 App/scripts/toolchain.py --github-env "$GITHUB_ENV" 2>&1 | tee .build/native-evidence/pin-selection.txt
      - name: Verify fresh dependency and build caches
        run: |
          set -o pipefail
          python3 - <<'PY' | tee .build/native-evidence/empty-caches.txt
          from pathlib import Path
          for name in ("native-package-cache", "native-swift-tests", "native-source-packages", "native"):
              path = Path(".build") / name
              if path.exists():
                  raise SystemExit(f"Expected an empty clean-checkout cache at {path}; use a fresh checkout without restored caches.")
              print(f"Verified absent before dependency resolution/build: {path}")
          PY
      - name: Record toolchain
        run: |
          mkdir -p .build/native-evidence
          xcodebuild -version | tee .build/native-evidence/xcode.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') .build/native-evidence/xcode.txt
          sw_vers | tee .build/native-evidence/macos.txt
          swift --version | tee .build/native-evidence/swift.txt
          xcrun simctl list runtimes | tee .build/native-evidence/runtimes.txt
      - name: Test UI journey runner guards
        run: python3 -m unittest discover -s App/scripts/tests -v
      - name: Test native editor model
        run: |
          set -euo pipefail
          swift test --package-path Packages/PlannerUI --cache-path "$PWD/.build/native-package-cache" --scratch-path "$PWD/.build/native-swift-tests" 2>&1 | tee .build/native-evidence/model-tests.txt
          for name in \
            testLocalRenamePreservesSnapshotAndHistoryAcrossRestart \
            testDuplicateCreatesFreshForkAndRetainsSyntheticQualificationAndLocks \
            testStaleRenameDuplicateAndDeleteCannotMutateNewerRevision \
            testConfirmedDeleteTargetsCapturedEntryAndPreservesDifferentSelection \
            testLargeLibraryRetainsCorruptWrapperAndUnrelatedMetadataAfterRenameDeleteAndRestart \
            testEntireUnreadablePageStillReachesLaterValidBuild \
            testMalformedQualificationCannotBeOpenedMutatedOrSilentlyDropped \
            testPreviewPreparationLeavesMainActorResponsive \
            testCancelledPreviewPreparationCannotPublishOrWrite \
            testExportPreparationLeavesMainActorResponsiveAndPreservesQualification \
            testClearedExportRejectsLateBytesAndErrorsAndRetryUsesNewAlias \
            testInvalidatedQueuedExportNeverEntersPreparation \
            testCancelledExportPreparationCannotPublishOrWrite
          do
            grep -E "Test Case .*ImportedBuildLibraryTests.*${name}.* passed" .build/native-evidence/model-tests.txt
          done
          for name in \
            testHistoryPageFailureKeepsContextAndSuccessfulRetryClearsItsNotice \
            testHistoryRecoveryPreservesIndependentConflictNotice \
            testHistoryRecoveryDoesNotClearOutstandingLibraryFailure
          do
            grep -E "Test Case .*DraftLibraryModelTests.*${name}.* passed" .build/native-evidence/model-tests.txt
          done
          python3 tools/ci/require_swift_test_results.py catalog-source-ui .build/native-evidence/model-tests.txt
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project App/Planner.xcodeproj -scheme Planner -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/native -clonedSourcePackagesDirPath .build/native-source-packages CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/native-evidence/build.txt
      - name: Launch on iPhone and iPad simulators
        run: |
          set -o pipefail
          python3 App/scripts/simulator-smoke.py 2>&1 | tee .build/native-evidence/launch.txt
      - name: Exercise durable notes and catalog browsing through the real app UI
        run: |
          set -o pipefail
          python3 App/scripts/ui-journey.py 2>&1 | tee .build/native-evidence/ui-journey.txt
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-local-drafts-evidence
          path: .build/native-evidence
          if-no-files-found: error
          retention-days: 14
