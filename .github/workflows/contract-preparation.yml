name: Contract preparation (Python reference only)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frozen-contract-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Apple preparation tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out pinned canonical research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Pick-Your-AI/pick-your-ai-research
          ref: 7acbefbf4e4e700231e88be272bc89e3a73dde15
          path: .canonical-research
          persist-credentials: false
      - name: Select preparation Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install hash-verified validation wheels in a fresh environment
        run: |
          set -euo pipefail
          conformance_env=$(mktemp -d "$RUNNER_TEMP/apple-conformance.XXXXXX")
          python -m venv --without-pip "$conformance_env"
          python -m pip --python "$conformance_env/bin/python" --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tools/conformance/requirements-lock.txt
          python -m pip --python "$conformance_env/bin/python" --isolated check
          printf 'APPLE_CONFORMANCE_PYTHON=%s\n' "$conformance_env/bin/python" >> "$GITHUB_ENV"
      - name: Run frozen reference, vectors and mutation checks
        run: >-
          "$APPLE_CONFORMANCE_PYTHON" tools/conformance/run.py
          --contract-root .canonical-research/contracts/v1
          --output contract-preparation.json
      - name: Replay shared Swift pricebook vectors against the pinned schema
        run: '"$APPLE_CONFORMANCE_PYTHON" tools/conformance/pricebook_vectors.py --contract-root .canonical-research/contracts/v1'
      - name: Replay raw JSON without collapsing repeated keys
        run: '"$APPLE_CONFORMANCE_PYTHON" tools/conformance/raw_core_vectors.py --contract-root .canonical-research/contracts/v1'
      - name: Test preparation harness failure and recovery
        env:
          CONTRACT_ROOT: .canonical-research/contracts/v1
        run: '"$APPLE_CONFORMANCE_PYTHON" -m unittest discover -s tools/conformance/tests -v'
      - name: Verify identical Swift vectors and source fixture provenance
        run: >-
          "$APPLE_CONFORMANCE_PYTHON" tools/conformance/export_swift_vectors.py
          --contract-root .canonical-research/contracts/v1
          --output Packages/PlannerCore/Tests/PlannerCoreTests/Fixtures/evaluation-vectors.json
          --check
      - name: Retain synthetic preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-contract-preparation
          path: contract-preparation.json
          if-no-files-found: error
          retention-days: 14
