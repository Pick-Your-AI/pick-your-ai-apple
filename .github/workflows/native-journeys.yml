name: Native draft UI journeys
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-draft-journeys:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require toolchain and record identity
        run: |
          set -euo pipefail
          mkdir -p .build/native-ui-evidence
          xcodebuild -version | tee .build/native-ui-evidence/xcode.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') .build/native-ui-evidence/xcode.txt
          swift --version | tee .build/native-ui-evidence/swift.txt
          sw_vers | tee .build/native-ui-evidence/macos.txt
          git rev-parse HEAD | tee .build/native-ui-evidence/commit.txt
      - name: Exercise saved notes, relaunch, discard and deletion through the UI
        run: |
          set -euo pipefail
          python3 App/scripts/run-ui-journeys.py 2>&1 | tee .build/native-ui-evidence/journeys.log
      - name: Retain simulator UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-draft-ui-journeys
          path: .build/native-ui-evidence
          if-no-files-found: error
          retention-days: 14
