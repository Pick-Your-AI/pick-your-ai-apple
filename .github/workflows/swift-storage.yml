name: Swift local storage
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  scope:
    name: macos-storage documentation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative scope selection
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_native_scope.py' -v
      - name: Inspect complete exact Git comparison
        id: scope
        env:
          APPLE_CI_JOB: macos-storage
          APPLE_CI_EVENT: ${{ github.event_name }}
          APPLE_CI_HEAD: ${{ github.sha }}
          APPLE_CI_BASE: ${{ github.event.pull_request.base.sha }}
          APPLE_CI_BEFORE: ${{ github.event.before }}
        run: python3 tools/ci/native_scope.py
  macos-storage:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native_required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require toolchain and record identity
        run: |
          set -euo pipefail
          xcodebuild -version | tee storage-toolchain.log
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') storage-toolchain.log
          swift --version | tee -a storage-toolchain.log
          sw_vers | tee -a storage-toolchain.log
      - name: Test crash replay exit and SQLite guards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/storage/tests -p 'test_crash_replay.py' -v 2>&1 | tee storage-replay-guards.log
      - name: Run storage regression tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-migration"
          rm -f "$RUNNER_TEMP/apple-migration/macos.json" "$RUNNER_TEMP/apple-migration/iphone.json" "$RUNNER_TEMP/apple-migration/ipad.json"
          swift test --package-path Packages/PlannerData --scratch-path .build-storage -Xswiftc -warnings-as-errors 2>&1 | tee storage-tests.log
          python3 tools/conformance/consumer_receipts.py migration \
            --log storage-tests.log --exit-code 0 --output "$RUNNER_TEMP/apple-migration/macos.json"
      - name: Test pending-write replay guards
        run: |
          set -euo pipefail
          python3 tools/storage/pending_write_replay.py --self-test 2>&1 | tee storage-pending-replay-guards.log
      - name: Replay actual process termination during write and migration
        run: |
          set -euo pipefail
          python3 tools/storage/crash_replay.py .build-storage/debug/DraftCrashProbe | tee storage-crash.log
      - name: Replay actual pending-write commit interruptions
        run: |
          set -euo pipefail
          python3 tools/storage/pending_write_replay.py .build-storage/debug/PendingWriteCrashProbe | tee storage-pending-crash.log
      - name: Compile library for iOS Simulator without signing
        working-directory: Packages/PlannerData
        run: |
          set -euo pipefail
          xcodebuild -scheme PlannerData -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/planner-data-derived CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/storage-ios-build.log"
      - name: Run recovery regression tests on compact iPhone and iPad simulators
        working-directory: Packages/PlannerData
        run: |
          set -euo pipefail
          xcrun simctl list --json > "$GITHUB_WORKSPACE/storage-simulator-inventory.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          inventory = json.loads((root / "storage-simulator-inventory.json").read_text())
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          if not any(r["identifier"] == runtime and r.get("isAvailable") for r in inventory["runtimes"]):
              raise SystemExit("Required installed iOS 18.5 runtime unavailable")
          rows = []
          for label, name in [("iphone", "iPhone SE (3rd generation)"), ("ipad", "iPad (10th generation)")]:
              matches = [d for d in inventory["devices"].get(runtime, []) if d["name"] == name and d.get("isAvailable")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one available {name}, found {len(matches)}")
              rows.append(f"{label}\t{matches[0]['udid']}")
          (root / "storage-simulator-selection.tsv").write_text("\n".join(rows) + "\n")
          PYTHON
          while IFS=$'\t' read -r label udid; do
            xcodebuild test -scheme PlannerData-Package \
              -destination "platform=iOS Simulator,id=$udid" \
              -destination-timeout 120 -parallel-testing-enabled NO \
              -derivedDataPath /tmp/planner-data-simulator-tests \
              -resultBundlePath "$GITHUB_WORKSPACE/storage-$label.xcresult" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/storage-$label-tests.log"
            # Require all 31 draft, 35 pending-write and four migration methods,
            # including future-history/WAL/journal cases and scoped observations.
            python3 "$GITHUB_WORKSPACE/tools/conformance/consumer_receipts.py" migration \
              --log "$GITHUB_WORKSPACE/storage-$label-tests.log" --exit-code 0 \
              --output "$RUNNER_TEMP/apple-migration/$label.json"
            grep -E 'Test Case .*DraftStoreTests.*testInterruptedMigrationRollsBackSchemaThenRecovers.* passed' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Test Case .*DraftStoreTests.*testRestoreRejectsFutureHistoryWithoutChangingReadableDrafts.* passed' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Executed 31 tests, with 0 failures' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Test Case .*PendingBuildWriteStoreTests.*testReopenRecoversCommittedAttemptAsUncertainWithoutResend.* passed' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Test Case .*PendingBuildWriteStoreTests.*testFailedActivationCommitPreservesGenerationAndAttempt.* passed' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Test Case .*PendingBuildWriteStoreTests.*testActualSQLiteFullRetainsQueueThenUnconstrainedReopenRecovers.* passed' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Executed 35 tests, with 0 failures' "$GITHUB_WORKSPACE/storage-$label-tests.log"
            grep -E 'Executed 70 tests, with 0 failures' "$GITHUB_WORKSPACE/storage-$label-tests.log"
          done < "$GITHUB_WORKSPACE/storage-simulator-selection.tsv"
      - name: Retain storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-storage-validation
          path: |
            storage-*.log
            storage-simulator-inventory.json
            storage-simulator-selection.tsv
            storage-*.xcresult
            ${{ runner.temp }}/apple-migration/
          if-no-files-found: error
          retention-days: 14
