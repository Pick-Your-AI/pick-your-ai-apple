name: Swift build transfer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-transfer:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          xcodebuild -version | tee /tmp/transfer-xcode.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') /tmp/transfer-xcode.txt
          swift --version
          sw_vers
      - name: Verify canonical hashes and reference validator parity
        run: |
          set -euo pipefail
          python3 -m venv /tmp/transfer-python
          /tmp/transfer-python/bin/pip install 'jsonschema[format]==4.26.0'
          /tmp/transfer-python/bin/python Packages/PlannerTransfer/Tools/verify_contract.py
      - name: Run Swift boundary and adversarial tests
        run: swift test --package-path Packages/PlannerTransfer
      - name: Compile unsigned iOS Simulator boundary
        working-directory: Packages/PlannerTransfer
        run: xcodebuild -scheme PlannerTransfer -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/planner-transfer-derived CODE_SIGNING_ALLOWED=NO build
