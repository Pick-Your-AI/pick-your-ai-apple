name: Swift build transfer
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  scope:
    name: macos-transfer documentation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative scope selection
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_native_scope.py' -v
      - name: Inspect complete exact Git comparison
        id: scope
        env:
          APPLE_CI_JOB: macos-transfer
          APPLE_CI_EVENT: ${{ github.event_name }}
          APPLE_CI_HEAD: ${{ github.sha }}
          APPLE_CI_BASE: ${{ github.event.pull_request.base.sha }}
          APPLE_CI_BEFORE: ${{ github.event.before }}
        run: python3 tools/ci/native_scope.py
  macos-transfer:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native_required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          xcodebuild -version | tee /tmp/transfer-xcode.txt
          diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') /tmp/transfer-xcode.txt
          swift --version
          sw_vers
      - name: Verify canonical hashes and reference validator parity
        run: |
          set -euo pipefail
          transfer_python=$(mktemp -d "$RUNNER_TEMP/apple-transfer.XXXXXX")
          python3 -m venv "$transfer_python"
          "$transfer_python/bin/python" --version
          "$transfer_python/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r Packages/PlannerTransfer/Tools/requirements.txt
          "$transfer_python/bin/python" -m pip check
          "$transfer_python/bin/python" Packages/PlannerTransfer/Tools/verify_contract.py
          "$transfer_python/bin/python" -m unittest discover -s Packages/PlannerTransfer/Tools/tests -p 'test_context_vectors.py' -v
          "$transfer_python/bin/python" Packages/PlannerTransfer/Tools/context_vectors.py
      - name: Run Swift boundary and adversarial tests
        run: swift test --package-path Packages/PlannerTransfer
      - name: Compile unsigned iOS Simulator boundary
        working-directory: Packages/PlannerTransfer
        run: xcodebuild -scheme PlannerTransfer -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/planner-transfer-derived CODE_SIGNING_ALLOWED=NO build
